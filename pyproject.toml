[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom"
version = "0.1.0"
description = "Experimental programming language for humans and AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Axiom contributors" }
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
axiom = "axiom.cli:main"

[tool.setuptools]
package-dir = {"" = "compiler"}

[tool.setuptools.packages.find]
where = ["compiler"]
